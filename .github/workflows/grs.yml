name: Update README cards
on:
  schedule:
    - cron: "37 4 * * *" # Off-peak time to avoid rate limits
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT so commits are attributed to mirzasaikatahmmed (not github-actions[bot])
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Generate stats cards (primary → fallback)
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          STATS_QS="username=${USERNAME}&show_icons=true&hide_border=true&bg_color=0D1224&title_color=16F2B3&icon_color=EC4899&text_color=D3D8E8"
          LANGS_QS="username=${USERNAME}&layout=compact&langs_count=10&hide=html&hide_border=true&bg_color=0D1224&title_color=16F2B3&text_color=D3D8E8"

          # Official host often returns DEPLOYMENT_PAUSED; community mirror as fallback
          BASES=(
            "https://github-readme-stats.vercel.app"
            "https://github-readme-stats.shion.dev"
          )

          is_valid_svg() {
            local file="$1"
            grep -q '<svg' "$file" || return 1
            ! grep -qiE 'Resource limits|Something went wrong|exceeded|DEPLOYMENT_PAUSED|unavailable|SERVICE_UNAVAILABLE' "$file"
          }

          fetch_card() {
            local path="$1" qs="$2" out="$3"
            for base in "${BASES[@]}"; do
              echo "Trying ${base}${path}"
              if curl -fsS "${base}${path}?${qs}" -o "$out" && is_valid_svg "$out"; then
                echo "OK via $base -> $out"
                return 0
              fi
              echo "Failed via $base"
            done
            echo "ERROR: all endpoints failed for $out"
            cat "$out" 2>/dev/null || true
            return 1
          }

          mkdir -p profile
          fetch_card "/api" "$STATS_QS" "profile/stats.svg"
          fetch_card "/api/top-langs" "$LANGS_QS" "profile/top-langs.svg"

      - name: Commit cards only
        run: |
          git config user.name "mirzasaikatahmmed"
          git config user.email "30868301+mirzasaikatahmmed@users.noreply.github.com"
          git add -- profile/stats.svg profile/top-langs.svg
          if git status --porcelain | grep -vE '^M  profile/(stats|top-langs)\.svg$'; then
            echo "ERROR: unexpected changes detected; refusing to commit"
            git status --porcelain
            exit 1
          fi
          git commit -m "Update README cards" || exit 0
          git push
