<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Mirza Saikat Ahmmed, Software Engineer">
<defs>
<radialGradient id="glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#7D8CFF" stop-opacity="0.22"/><stop offset="1" stop-color="#7D8CFF" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:ui-monospace,"Geist Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.line{font-size:20px;opacity:0}
.cur{animation:blink 1s steps(1) infinite}
.name{font-size:38px;font-weight:700}
.l0{animation:fade 12s linear infinite;animation-delay:0s}
.l1{animation:fade 12s linear infinite;animation-delay:3s}
.l2{animation:fade 12s linear infinite;animation-delay:6s}
.l3{animation:fade 12s linear infinite;animation-delay:9s}
