</style>
<rect width="900" height="240" rx="14" fill="#0A0D14"/>
<rect width="900" height="240" rx="14" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="899" height="239" rx="14" fill="none" stroke="#222A3A"/>
<rect x="0.5" y="0.5" width="899" height="40" rx="14" fill="#121722"/>
<rect x="0.5" y="26" width="899" height="15" fill="#121722"/>
