<text class="line l0" x="64" y="186" fill="#7D8CFF">&gt; <tspan fill="#E8EBF2">Software Engineer · Dhaka, Bangladesh</tspan><tspan class="cur" fill="#F2B25C">▍</tspan></text>
<text class="line l1" x="64" y="186" fill="#7D8CFF">&gt; <tspan fill="#E8EBF2">Next.js + NestJS + TypeScript</tspan><tspan class="cur" fill="#F2B25C">▍</tspan></text>
